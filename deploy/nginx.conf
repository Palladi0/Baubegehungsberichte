# Nginx-Konfiguration für Baubegehungsberichte
# Datei nach /etc/nginx/sites-available/baubegehungsberichte kopieren
# und mit: sudo ln -s /etc/nginx/sites-available/baubegehungsberichte /etc/nginx/sites-enabled/
# dann: sudo certbot --nginx -d DEINE-DOMAIN.de

server {
    listen 80;
    server_name DEINE-DOMAIN.de www.DEINE-DOMAIN.de;

    # Weitergeleitet von Certbot zu HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name DEINE-DOMAIN.de www.DEINE-DOMAIN.de;

    # SSL (von Certbot befüllt)
    # ssl_certificate /etc/letsencrypt/live/DEINE-DOMAIN.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/DEINE-DOMAIN.de/privkey.pem;

    # Sicherheits-Header
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Uploads: direkt von Nginx ausliefern (kein Node.js Overhead)
    location /uploads/ {
        alias /var/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # Kein Verzeichnis-Listing
        autoindex off;
    }

    # Next.js App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts für lange API-Calls (z.B. PDF-Generierung, Whisper)
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Next.js static assets cachen
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    client_max_body_size 50M;
}
